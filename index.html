<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AM Operating System · DGL Freight Broker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --navy:#05035C; --navy-d:#030326; --navy-l:#EEF0FA;
  --green:#77B82A; --green-l:#F0F8E6; --green-d:#5C9020;
  --red:#C0392B; --red-l:#FDECEA;
  --amber:#D4860A; --amber-l:#FFF4DC;
  --purple:#6B2FA0; --purple-l:#F3EAFB;
  --gray:#667085; --border:#E1E4EA; --bg:#F5F6FA; --white:#FFFFFF;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--navy-d);overflow:hidden;font-size:14px;}
button,input,select,textarea{font-family:inherit;font-size:inherit;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:#c9cede;border-radius:8px;}

/* ═══ LAYOUT SHELL ═══ */
.shell{display:flex;height:100vh;}

/* ═══ SIDEBAR ═══ */
.sidebar{width:290px;flex-shrink:0;background:linear-gradient(180deg,var(--navy) 0%,#08065A 100%);display:flex;flex-direction:column;box-shadow:2px 0 12px rgba(5,3,92,.15);z-index:10;}
.sidebar-brand{padding:22px 22px 16px;border-bottom:1px solid rgba(255,255,255,.08);}
.sidebar-logo{height:34px;width:auto;display:block;margin-bottom:12px;}
.sidebar-tag{font-size:9.5px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--green);opacity:.9;}
.sidebar-sub{font-size:11px;color:rgba(255,255,255,.5);margin-top:3px;}

.sidebar-nav{flex:1;padding:10px 12px;overflow-y:auto;}
.nav-label{font-size:9px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:rgba(255,255,255,.32);padding:12px 10px 6px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;cursor:pointer;transition:all .15s;margin-bottom:2px;border:1px solid transparent;position:relative;}
.nav-item:hover{background:rgba(255,255,255,.05);}
.nav-item.active{background:rgba(119,184,42,.16);border-color:rgba(119,184,42,.35);}
.nav-item.active::before{content:"";position:absolute;left:-12px;top:50%;transform:translateY(-50%);width:4px;height:18px;background:var(--green);border-radius:0 4px 4px 0;}
.nav-icon{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;background:rgba(255,255,255,.06);}
.nav-item.active .nav-icon{background:var(--green);}
.nav-name{font-size:11.5px;font-weight:600;color:rgba(255,255,255,.82);line-height:1.3;}
.nav-item.active .nav-name{color:#fff;font-weight:700;}
.nav-badge{margin-left:auto;font-size:9px;font-weight:800;padding:1px 6px;border-radius:20px;background:var(--red);color:#fff;font-family:'JetBrains Mono',monospace;}

.sidebar-footer{padding:12px 20px;border-top:1px solid rgba(255,255,255,.08);}
.sidebar-footer-text{font-size:9px;color:rgba(255,255,255,.35);line-height:1.5;}

/* ═══ MAIN AREA ═══ */
.main{flex:1;display:flex;flex-direction:column;min-width:0;}
.topbar{height:58px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 26px;flex-shrink:0;box-shadow:0 1px 3px rgba(5,3,92,.03);}
.topbar-crumb{display:flex;align-items:center;gap:10px;}
.topbar-icon{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;background:var(--green-l);}
.topbar-title{font-size:13.5px;font-weight:700;color:var(--navy);}
.topbar-title span{color:var(--green-d);}
.topbar-right{display:flex;align-items:center;gap:10px;}
.topbar-badge{font-size:9.5px;font-weight:700;padding:4px 12px;border-radius:20px;border:1px solid rgba(119,184,42,.35);color:var(--green-d);background:var(--green-l);font-family:'JetBrains Mono',monospace;}
.topbar-role{font-size:10.5px;color:var(--gray);font-weight:600;}

.view-wrap{flex:1;overflow-y:auto;padding:24px 30px 60px;}
.view{display:none;animation:fadeIn .18s ease;}
.view.active{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}

.view-hdr{margin-bottom:18px;}
.view-title{font-size:19px;font-weight:800;color:var(--navy);}
.view-title span{color:var(--green-d);}
.view-sub{font-size:12px;color:var(--gray);max-width:760px;line-height:1.5;margin-top:3px;}

/* ═══ COMMON WIDGETS ═══ */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px;}
.kpi-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px 18px;cursor:pointer;transition:all .15s;border-left:4px solid var(--navy);}
.kpi-card:hover{box-shadow:0 4px 14px rgba(5,3,92,.08);transform:translateY(-1px);}
.kpi-card.red{border-left-color:var(--red);}
.kpi-card.amber{border-left-color:var(--amber);}
.kpi-card.green{border-left-color:var(--green);}
.kpi-card.purple{border-left-color:var(--purple);}
.kpi-num{font-size:28px;font-weight:800;color:var(--navy);font-family:'JetBrains Mono',monospace;line-height:1;}
.kpi-num.red{color:var(--red);}
.kpi-num.amber{color:#A8690A;}
.kpi-num.green{color:var(--green-d);}
.kpi-num.purple{color:var(--purple);}
.kpi-label{font-size:11px;font-weight:700;color:var(--navy);margin-top:6px;}
.kpi-desc{font-size:10px;color:var(--gray);margin-top:2px;line-height:1.4;}

.card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:18px 20px;margin-bottom:16px;}
.card-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.card-title{font-size:13px;font-weight:800;color:var(--navy);}
.card-title span{color:var(--green-d);}

table{width:100%;border-collapse:collapse;font-size:11.5px;}
th{text-align:left;padding:8px 10px;font-size:9.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--gray);border-bottom:2px solid var(--border);white-space:nowrap;}
td{padding:9px 10px;border-bottom:1px solid #EEF0F4;vertical-align:middle;}
tr.rowhover:hover{background:var(--navy-l);cursor:pointer;}

.badge{display:inline-flex;align-items:center;gap:4px;font-size:9.5px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap;}
.b-navy{background:var(--navy-l);color:var(--navy);}
.b-green{background:var(--green-l);color:var(--green-d);}
.b-red{background:var(--red-l);color:var(--red);}
.b-amber{background:var(--amber-l);color:#A8690A;}
.b-purple{background:var(--purple-l);color:var(--purple);}
.b-gray{background:#F0F2F5;color:#555;}

.bar-wrap{background:#EEF0F4;border-radius:6px;height:8px;overflow:hidden;width:100%;}
.bar-fill{height:100%;border-radius:6px;}

.btn{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;padding:7px 14px;border-radius:8px;border:1px solid var(--border);background:#fff;color:var(--navy);cursor:pointer;transition:all .15s;}
.btn:hover{background:var(--navy-l);}
.btn-primary{background:var(--navy);color:#fff;border-color:var(--navy);}
.btn-primary:hover{background:#0a0870;}
.btn-green{background:var(--green);color:#fff;border-color:var(--green);}
.btn-green:hover{background:var(--green-d);}
.btn-red{background:#fff;color:var(--red);border-color:rgba(192,57,43,.35);}
.btn-red:hover{background:var(--red-l);}
.btn-sm{padding:5px 10px;font-size:10px;}
.btn-xs{padding:3px 8px;font-size:9.5px;border-radius:6px;}

.tabs-row{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;}
.tab-chip{padding:6px 13px;border-radius:20px;font-size:10.5px;font-weight:700;background:#fff;border:1px solid var(--border);color:var(--gray);cursor:pointer;}
.tab-chip.active{background:var(--navy);color:#fff;border-color:var(--navy);}

.grid-2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}

/* Kanban */
.kanban{display:grid;grid-template-columns:repeat(9,1fr);gap:10px;overflow-x:auto;}
.kanban-col{background:#F0F1F6;border-radius:10px;padding:10px;min-width:150px;}
.kanban-col-hdr{font-size:9.5px;font-weight:800;color:var(--navy);text-transform:uppercase;letter-spacing:.3px;margin-bottom:8px;display:flex;justify-content:space-between;}
.kanban-card{background:#fff;border:1px solid var(--border);border-radius:8px;padding:8px 9px;margin-bottom:7px;cursor:pointer;font-size:10.5px;transition:box-shadow .15s;}
.kanban-card:hover{box-shadow:0 2px 8px rgba(5,3,92,.1);}
.kanban-card-name{font-weight:700;color:var(--navy);margin-bottom:3px;}
.kanban-card-meta{font-size:9px;color:var(--gray);}

/* Modal */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(5,3,38,.55);z-index:100;align-items:center;justify-content:center;}
.modal-bg.active{display:flex;}
.modal{background:#fff;border-radius:14px;width:560px;max-width:92vw;max-height:88vh;overflow-y:auto;padding:22px 24px;}
.modal-hdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;}
.modal-title{font-size:15px;font-weight:800;color:var(--navy);}
.modal-close{cursor:pointer;font-size:18px;color:var(--gray);background:none;border:none;}
.field{margin-bottom:12px;}
.field label{display:block;font-size:10.5px;font-weight:700;color:var(--navy);margin-bottom:5px;}
.field input,.field select,.field textarea{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:#fafbfd;}
.field textarea{min-height:70px;resize:vertical;}

.timeline{border-left:2px solid var(--border);margin-left:8px;padding-left:16px;}
.tl-item{position:relative;padding-bottom:16px;}
.tl-item::before{content:"";position:absolute;left:-21px;top:2px;width:10px;height:10px;border-radius:50%;background:var(--green);border:2px solid #fff;box-shadow:0 0 0 2px var(--green);}
.tl-date{font-size:9.5px;color:var(--gray);font-family:'JetBrains Mono',monospace;}
.tl-action{font-size:11.5px;font-weight:700;color:var(--navy);margin:2px 0;}
.tl-meta{font-size:10.5px;color:#445;line-height:1.5;}

.agent-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:14px;}
.agent-hdr{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.agent-icon{width:34px;height:34px;border-radius:9px;background:var(--navy-l);display:flex;align-items:center;justify-content:center;font-size:16px;}
.agent-name{font-size:13px;font-weight:800;color:var(--navy);}
.agent-goal{font-size:11px;color:var(--gray);margin-bottom:10px;}
.agent-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 16px;font-size:10.5px;}
.agent-grid b{color:var(--navy);}

.toggle{position:relative;display:inline-block;width:38px;height:20px;flex-shrink:0;}
.toggle input{opacity:0;width:0;height:0;}
.toggle-slider{position:absolute;cursor:pointer;inset:0;background:#ccc;border-radius:20px;transition:.2s;}
.toggle-slider::before{content:"";position:absolute;height:14px;width:14px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.2s;}
.toggle input:checked + .toggle-slider{background:var(--green);}
.toggle input:checked + .toggle-slider::before{transform:translateX(18px);}

.empty{text-align:center;padding:30px;color:var(--gray);font-size:11.5px;}
.small{font-size:10px;color:var(--gray);}
.mono{font-family:'JetBrains Mono',monospace;}
.flex-between{display:flex;justify-content:space-between;align-items:center;}
.flex-gap{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}

@media(max-width:1100px){.kpi-grid{grid-template-columns:repeat(2,1fr);}.grid-2{grid-template-columns:1fr;}}
</style>
</head>

<script id="app-data">
const STORAGE_KEY = 'dgl_am_os_v3';
const STAGES = ['Nuevo','Pendiente Clasificacion','Asignado','Activo','Pendiente Rotacion','Rotacion Aprobada','Transferido','Inactivo','Archivado'];

const STAGE_COLOR = {
  'Nuevo':'b-purple','Pendiente Clasificacion':'b-amber','Asignado':'b-navy','Activo':'b-green',
  'Pendiente Rotacion':'b-amber','Rotacion Aprobada':'b-purple','Transferido':'b-navy','Inactivo':'b-red','Archivado':'b-gray'
};

function daysAgo(n){ const d=new Date(); d.setDate(d.getDate()-n); return d.toISOString().slice(0,10); }
function fmtDate(d){ if(!d) return '-'; const dt=new Date(d); return dt.toLocaleDateString('es-CO',{day:'2-digit',month:'short',year:'numeric'}); }
function daysSince(d){ return Math.round((new Date()-new Date(d))/86400000); }
function uid(prefix){ return prefix+'-'+Math.random().toString(36).slice(2,8); }

function seedData(){
  const ams = [
    {id:'am1', name:'Camila Restrepo', country:'Colombia', languages:['es','en'], capacity:10, industries:['Retail','Consumo Masivo','Textil']},
    {id:'am2', name:'Jorge Munera', country:'Mexico', languages:['es'], capacity:9, industries:['Manufactura','Automotriz']},
    {id:'am3', name:'Ana Beatriz Lima', country:'Brasil', languages:['pt','en'], capacity:10, industries:['Agro','Alimentos']},
    {id:'am4', name:'Diego Fonseca', country:'Colombia', languages:['es','en'], capacity:8, industries:['E-commerce','Tecnologia']},
    {id:'am5', name:'Sarah Collins', country:'USA', languages:['en'], capacity:11, industries:['Retail','Farma','Tecnologia']},
    {id:'am6', name:'Mateo Ibarra', country:'Chile', languages:['es'], capacity:9, industries:['Mineria','Manufactura']}
  ];

  const names = ['Andes Cargo SAS','Grupo Vallemar','NovaFrigo Logistics','Tecnicomex','Distriagro del Norte','Corpotex Manufacturing',
    'BlueRiver Foods','Minera Altiplano','FarmaExpress Latam','Continental Auto Parts','Sabana Retail Group','Puerto Seco Andino',
    'Rutas del Pacifico','Grupo Textilia','MetalCorp Industrial','AgroFrontera SAS','QuimiCarga del Caribe','Cadena Fresh Produce',
    'TransAndina Import','Vertice E-commerce','NorthStar Freight Co','Cordillera Bebidas','SolarTech Components','Rio Verde Papelera'];

  const accounts = names.map((name,i)=>{
    const am = ams[i % ams.length];
    const industry = am.industries[i % am.industries.length];
    const complexity = 1 + (i*7 % 5);
    const priority = ['Alta','Media','Baja'][i % 3];
    const lastAct = daysAgo([3,8,15,22,40,55,70,5,12,30][i%10]);
    let stage = STAGES[3];
    if(i%13===0) stage='Nuevo';
    else if(i%11===0) stage='Pendiente Clasificacion';
    else if(i%9===0) stage='Asignado';
    else if(i%7===0) stage='Pendiente Rotacion';
    else if(i%17===0) stage='Inactivo';
    else if(i%19===0) stage='Transferido';
    const docs = { contrato: i%6!==0, kyc: i%4!==0, acuerdoTarifario: i%5!==0, polizaSeguro: i%8!==0 };
    const renewalDate = daysAgo(-1*(10+ (i*13)%110));
    return {
      id: uid('acc'), name, industry, country: am.country, language: am.languages[0],
      complexity, priority, amId: am.id, stage, lastActivity: lastAct, docs, renewalDate,
      monthlyRevenue: 4000 + (i*735 % 26000),
      satisfaction: [5,4,3,4,5,2,4,3][i%8],
      slaBreaches30d: [0,0,1,0,2,0,0,3,0,1][i%10],
      reviewDueDate: daysAgo(-1*((i*5)%35 - 10)),
      history: [
        {date: daysAgo(120), user:'Sistema', action:'Cuenta creada', reason:'Alta inicial en CRM', evidence:''},
        {date: daysAgo(110), user:'Laura Simoes (TL)', action:'Clasificacion asignada', reason:'Industria '+industry+', complejidad '+complexity, evidence:'Ficha de clasificacion'},
        {date: daysAgo(100), user:'Laura Simoes (TL)', action:'Asignado a '+am.name, reason:'Motor de asignacion - match idioma/pais/industria', evidence:'Log motor de asignacion'}
      ]
    };
  });

  return {
    ams, accounts,
    audit: [
      {date: daysAgo(2), user:'Laura Simoes (TL)', action:'Aprobo rotacion', target:'Rio Verde Papelera', reason:'Sobrecarga del AM origen (>95% capacidad)'},
      {date: daysAgo(5), user:'Laura Simoes (TL)', action:'Aprobo asignacion', target:'Vertice E-commerce', reason:'Cuenta nueva clasificada Alta prioridad'},
      {date: daysAgo(9), user:'Laura Simoes (TL)', action:'Archivo cuenta', target:'Cordillera Bebidas', reason:'Cliente dado de baja por Finanzas'}
    ],
    config: {
      inactivityThresholdDays: 30,
      workloadThresholdPct: 85,
      docCompletionThresholdPct: 75,
      rotationWeights: { workload:0.35, inactivity:0.25, mismatch:0.20, complexity:0.20 }
    },
    automations: [
      {id:'auto1', name:'Clasificacion automatica de cuentas nuevas', desc:'Al crear una cuenta, sugiere industria/complejidad/prioridad segun reglas configurables.', enabled:true},
      {id:'auto2', name:'Validacion de documentacion obligatoria', desc:'Verifica diariamente contrato, KYC, acuerdo tarifario y poliza; genera alerta si falta alguno.', enabled:true},
      {id:'auto3', name:'Balanceo de portafolio', desc:'Detecta AMs por encima del umbral de capacidad y sugiere candidatos de rotacion.', enabled:true},
      {id:'auto4', name:'Generacion de tareas de revision mensual', desc:'Crea tarea de revision cuando una cuenta llega a su fecha de review.', enabled:true},
      {id:'auto5', name:'Alertas de inactividad', desc:'Marca cuentas sin actividad registrada por mas del umbral configurado.', enabled:true},
      {id:'auto6', name:'Recordatorios de renovacion', desc:'Notifica cuentas con renovacion dentro de 30/15/7 dias.', enabled:true},
      {id:'auto7', name:'Auditoria continua', desc:'Registra automaticamente todo cambio de etapa, asignacion o rotacion con responsable y fecha.', enabled:true},
      {id:'auto8', name:'Generacion de reportes', desc:'Consolida KPIs semanales/mensuales para el Team Leader y exporta a CSV.', enabled:true},
      {id:'auto9', name:'Seguimiento de rotaciones', desc:'Da seguimiento a rotaciones aprobadas hasta su transferencia efectiva.', enabled:true}
    ]
  };
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  const s = seedData();
  saveState(s);
  return s;
}
function saveState(s){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); }catch(e){} }

let STATE = loadState();
function persist(){ saveState(STATE); }

</script>
<script id="app-engine">
/* ============ ENGINES ============ */
function accountsByAM(amId){ return STATE.accounts.filter(a=>a.amId===amId); }
function activeAccountsByAM(amId){ return accountsByAM(amId).filter(a=>['Activo','Asignado','Pendiente Rotacion'].includes(a.stage)); }
function workloadPct(am){ return Math.round(100*activeAccountsByAM(am.id).length/am.capacity); }
function amById(id){ return STATE.ams.find(a=>a.id===id); }
function accById(id){ return STATE.accounts.find(a=>a.id===id); }

function docCompletionPct(acc){
  const vals = Object.values(acc.docs);
  return Math.round(100*vals.filter(Boolean).length/vals.length);
}
function missingDocs(acc){
  const labels = {contrato:'Contrato', kyc:'KYC', acuerdoTarifario:'Acuerdo Tarifario', polizaSeguro:'Poliza de Seguro'};
  return Object.keys(acc.docs).filter(k=>!acc.docs[k]).map(k=>labels[k]);
}
function inactivityDays(acc){ return daysSince(acc.lastActivity); }
function isInactive(acc){ return inactivityDays(acc) > STATE.config.inactivityThresholdDays; }

function riskScore(acc){
  let score = 0;
  const inact = inactivityDays(acc);
  if(inact>60) score+=35; else if(inact>30) score+=20; else if(inact>15) score+=8;
  const doc = docCompletionPct(acc);
  if(doc<50) score+=25; else if(doc<75) score+=12;
  score += Math.min(acc.slaBreaches30d*8, 24);
  if(acc.satisfaction<=2) score+=20; else if(acc.satisfaction===3) score+=8;
  const am = amById(acc.amId);
  if(am && workloadPct(am)>100) score+=10;
  return Math.min(score,100);
}
function riskLevel(acc){
  const s = riskScore(acc);
  if(s>=55) return {label:'Alto', cls:'b-red'};
  if(s>=30) return {label:'Medio', cls:'b-amber'};
  return {label:'Bajo', cls:'b-green'};
}

function rotationScore(acc){
  const w = STATE.config.rotationWeights;
  const am = amById(acc.amId);
  const wl = am ? Math.min(workloadPct(am)/100,1.3) : 0;
  const inact = Math.min(inactivityDays(acc)/90,1);
  const mismatch = (am && am.industries.includes(acc.industry)) ? 0 : 1;
  const complexityNorm = acc.complexity/5;
  return Math.round(100*(w.workload*wl + w.inactivity*inact + w.mismatch*mismatch + w.complexity*complexityNorm));
}
function rotationCandidates(){
  return STATE.accounts
    .filter(a=>['Activo','Asignado'].includes(a.stage))
    .map(a=>({acc:a, score: rotationScore(a)}))
    .filter(x=>x.score>=35)
    .sort((a,b)=>b.score-a.score);
}
function suggestAM(acc, excludeId){
  const candidates = STATE.ams.filter(am=>am.id!==excludeId);
  const scored = candidates.map(am=>{
    let s = 0;
    if(am.country===acc.country) s+=30;
    if(am.languages.includes(acc.language)) s+=25;
    if(am.industries.includes(acc.industry)) s+=25;
    const util = workloadPct(am);
    s += Math.max(0, 20*(1 - util/100));
    return {am, s, util};
  }).sort((a,b)=>b.s-a.s);
  return scored[0];
}

function logAudit(action, target, reason){
  STATE.audit.unshift({date: todayISOLike(), user:'Laura Simoes (TL)', action, target, reason});
  persist();
}
function todayISOLike(){ return new Date().toISOString().slice(0,10); }

function changeStage(accId, newStage, reason){
  const acc = accById(accId);
  if(!acc) return;
  acc.history.unshift({date: todayISOLike(), user:'Laura Simoes (TL)', action:'Etapa: '+acc.stage+' -> '+newStage, reason: reason||'Sin motivo especificado', evidence:''});
  acc.stage = newStage;
  logAudit('Cambio de etapa a '+newStage, acc.name, reason||'Sin motivo especificado');
  persist();
}
function reassignAccount(accId, newAmId, reason){
  const acc = accById(accId);
  if(!acc) return;
  const oldAm = amById(acc.amId);
  const newAm = amById(newAmId);
  acc.history.unshift({date: todayISOLike(), user:'Laura Simoes (TL)', action:'Reasignado de '+(oldAm?oldAm.name:'-')+' a '+newAm.name, reason: reason||'Rotacion aprobada', evidence:'Motor de rotacion'});
  acc.amId = newAmId;
  acc.stage = 'Transferido';
  logAudit('Rotacion aprobada -> '+newAm.name, acc.name, reason||'Rotacion aprobada por balanceo de carga');
  persist();
}

  return '<div class="view-hdr"><div class="view-title">Account Review <span>Center</span></div>'+
    '<div class="view-sub">Cuentas cuya revision periodica vence este mes. Checklist de revision mensual.</div></div>'+

      const overdue = new Date(a.reviewDueDate) < now;
      return '<tr><td><b>'+a.name+'</b></td><td>'+amName(a.amId)+'</td><td class="mono">'+fmtDate(a.reviewDueDate)+'</td>'+
      '<td><span class="badge '+(overdue?'b-red':'b-amber')+'">'+(overdue?'Vencida':'Pendiente')+'</span></td>'+

function reviewDone(accId){
  const acc = accById(accId);
  const next = new Date(); next.setDate(next.getDate()+30);
  acc.reviewDueDate = next.toISOString().slice(0,10);
  acc.history.unshift({date: todayISOLike(), user:'Laura Simoes (TL)', action:'Revision mensual completada', reason:'Revision periodica ejecutada segun checklist', evidence:''});
  logAudit('Revision mensual completada', acc.name, 'Checklist de revision ejecutado');
  persist();
  showModule('review');
}

RENDERERS.kpi = function(){
  const accs = STATE.accounts;
  const avgRisk = Math.round(accs.reduce((s,a)=>s+riskScore(a),0)/accs.length);
  const avgDocs = Math.round(accs.reduce((s,a)=>s+docCompletionPct(a),0)/accs.length);
  const avgSat = (accs.reduce((s,a)=>s+a.satisfaction,0)/accs.length).toFixed(2);
  const totalRev = accs.reduce((s,a)=>s+a.monthlyRevenue,0);
  const avgUtil = Math.round(STATE.ams.reduce((s,am)=>s+workloadPct(am),0)/STATE.ams.length);
  function kpi(label,val,desc){ return '<div class="kpi-card"><div class="kpi-num">'+val+'</div><div class="kpi-label">'+label+'</div><div class="kpi-desc">'+desc+'</div></div>'; }

    '<div class="view-sub">Indicadores centrales del departamento de Account Management.</div></div>'+
    '<div class="kpi-grid">'+
    kpi(accs.length,'Cuentas totales','Portafolio activo del departamento')+
    kpi(avgRisk,'Score de riesgo promedio','0-100, mientras mas bajo mejor')+
    kpi(avgDocs+'%','Completitud documental promedio','Meta: 100%')+
    kpi(avgSat+' / 5','Satisfaccion promedio','NPS interno / CSAT proxy')+
    kpi(money(totalRev),'Ingreso mensual gestionado','Suma de cuentas activas')+
    kpi(avgUtil+'%','Utilizacion promedio de AMs','Meta: 70-85%')+
    '</div>';
};

function toCSV(rows){
  return rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
}
function downloadFile(name, content){
  const blob = new Blob([content], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=name; a.click();
  URL.revokeObjectURL(url);
}
function exportCSV(){
  const rows = [['Cuenta','AM','Pais','Industria','Etapa','Prioridad','Complejidad','Inactividad(d)','Docs(%)','Riesgo','Renovacion']];
  STATE.accounts.forEach(a=>rows.push([a.name, amName(a.amId), a.country, a.industry, a.stage, a.priority, a.complexity, inactivityDays(a), docCompletionPct(a), riskLevel(a).label, a.renewalDate]));
  downloadFile('portafolio_am.csv', toCSV(rows));
}
function exportAuditCSV(){
  const rows = [['Fecha','Usuario','Accion','Cuenta','Motivo']];
  STATE.audit.forEach(e=>rows.push([e.date, e.user, e.action, e.target, e.reason]));
  downloadFile('auditoria_am.csv', toCSV(rows));
}
